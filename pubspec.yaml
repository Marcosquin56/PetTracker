name: pettracker
description: >
  PetTracker - Reporta y encuentra gatos y perros callejeros o perdidos cerca
  de ti, con geolocalización en tiempo real y notificaciones push.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State management ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # --- Firebase (solo push; datos/auth/fotos viven en el backend propio) ---
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.2

  # --- Backend propio (NestJS + PostgreSQL) ---
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^2.0.3+1

  # --- Navegación ---
  go_router: ^14.6.1
  url_launcher: ^6.3.1

  # --- Ubicación y mapas ---
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  google_maps_cluster_manager_2: ^3.2.0

  # --- Imágenes ---
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # --- Adjuntos de chat: foto (image_picker arriba), audio y archivos ---
  record: ^7.1.1
  just_audio: ^0.9.42
  file_picker: ^8.1.4
  path_provider: ^2.1.5

  # --- Modelos / utilidades ---
  equatable: ^2.0.5
  intl: ^0.19.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.13
  mocktail: ^1.0.4
  # Para fakear FlutterSecureStoragePlatform.instance en tests de widgets y
  # no tocar el keyring real del sistema (dbus/libsecret) al correr `flutter test`.
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E8703F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
